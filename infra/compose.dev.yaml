# Optional local development override:
#   docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml up
# Keeps production compose.yaml completely free of bind mounts and reload servers.

services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../services/api:/app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    volumes:
      - ../services/api:/app
